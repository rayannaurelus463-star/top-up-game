<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP UP GAME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

header {
  background: #151c35;
  text-align: center;
  padding: 25px 12px;
  border-bottom: 2px solid #8b5cf6;
}

header h1 {
  color: #a78bfa;
}

.container {
  width: 92%;
  max-width: 750px;
  margin: 25px auto;
}

.card {
  background: #171f38;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

h2 {
  color: #c4b5fd;
}

label {
  display: block;
  margin-top: 14px;
}

input, select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #394463;
  border-radius: 8px;
  background: #0b1020;
  color: white;
}

button {
  padding: 12px 16px;
  margin-top: 15px;
  background: #8b5cf6;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: 0.5;
}

.secondary {
  background: #334155;
}

#message {
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.order {
  background: #0b1020;
  border: 1px solid #394463;
  padding: 14px;
  margin-top: 12px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.small {
  color: #cbd5e1;
  font-size: 14px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>🎮 TOP UP GAME</h1>
  <p>Recharge tes jeux préférés !</p>
</header>

<main class="container">

  <section class="card">
    <h2>💎 Passer une commande</h2>

    <form id="orderForm">

      <label>Choisis ton jeu</label>
      <select id="game" required>
        <option value="">Choisir un jeu</option>
        <option>Free Fire</option>
        <option>PUBG Mobile</option>
        <option>Mobile Legends</option>
        <option>Call of Duty Mobile</option>
      </select>

      <label>Choisis ton forfait</label>
      <select id="pack" required>
        <option value="">Choisir un forfait</option>
      </select>

      <p id="price" class="small">
        Sélectionne un jeu et un forfait.
      </p>

      <label>ID du joueur</label>
      <input
        id="player"
        required
        maxlength="100"
        placeholder="Entre ton ID de joueur"
      >

      <label>Contact WhatsApp ou téléphone</label>
      <input
        id="contact"
        required
        maxlength="100"
        placeholder="Ton numéro de contact"
      >

      <label>Méthode de paiement</label>
      <select id="payment" required>
        <option value="">Choisir</option>
        <option>MonCash</option>
        <option>NatCash</option>
        <option>Autre</option>
      </select>

      <button id="submitButton" type="submit">
        Envoyer ma commande
      </button>

    </form>

    <p id="message" role="status"></p>
  </section>

  <section class="card">
    <h2>🔐 Espace administrateur</h2>

    <p class="small">
      Réservé à l'administrateur autorisé.
    </p>

    <form id="loginForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        required
        autocomplete="username"
      >

      <label>Mot de passe</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">Se connecter</button>

    </form>

    <p id="adminMessage" role="status"></p>

    <div id="dashboard" class="hidden">
      <h2>📋 Gestion des commandes</h2>

      <button id="refreshButton" type="button">
        Actualiser les commandes
      </button>

      <button id="logoutButton" class="secondary" type="button">
        Se déconnecter
      </button>

      <div id="orders"></div>
    </div>
  </section>

</main>

<footer>
  © 2026 TOP UP GAME
</footer>

<script>
/*
 ojyqwhvdcyueojqipptm REMPLACE CES DEUX VALEURS PAR LES INFORMATIONS
  DE TON PROJET SUPABASE.
*/

const SUPABASE_URL = "COLLE_TON_PROJECT_URL_ICI";
const SUPABASE_KEY = "COLLE_TA_PUBLISHABLE_KEY_ICI";
blccjtzbuviggczagafx
const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("COLLE_TON") &&
  !SUPABASE_KEY.includes("COLLE_TA");

let db = null;

if (configured && window.supabase) {
  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
}

const prices = {
  "Free Fire": [
    { name: "100 Diamonds — prix exemple", amount: 1 },
    { name: "310 Diamonds — prix exemple", amount: 2 },
    { name: "520 Diamonds — prix exemple", amount: 3 }
  ],

  "PUBG Mobile": [
    { name: "60 UC — prix exemple", amount: 1 },
    { name: "325 UC — prix exemple", amount: 2 }
  ],

  "Mobile Legends": [
    { name: "86 Diamonds — prix exemple", amount: 1 },
    { name: "172 Diamonds — prix exemple", amount: 2 }
  ],

  "Call of Duty Mobile": [
    { name: "80 CP — prix exemple", amount: 1 },
    { name: "420 CP — prix exemple", amount: 2 }
  ]
};

const game = document.getElementById("game");
const pack = document.getElementById("pack");
const price = document.getElementById("price");
const message = document.getElementById("message");

game.addEventListener("change", function () {
  pack.innerHTML = '<option value="">Choisir un forfait</option>';

  const options = prices[game.value] || [];

  options.forEach(function (item, index) {
    const option = document.createElement("option");

    option.value = String(index);
    option.textContent = item.name;

    pack.appendChild(option);
  });

  price.textContent = "Sélectionne un forfait.";
});

pack.addEventListener("change", function () {
  const options = prices[game.value] || [];
  const item = options[Number(pack.value)];

  price.textContent = item
    ? "Prix exemple : " + item.amount + " USD"
    : "Sélectionne un forfait.";
});

function newOrderNumber() {
  return "TG-" +
    Date.now().toString(36).toUpperCase() +
    "-" +
    Math.random().toString(36).slice(2, 7).toUpperCase();
}

document.getElementById("orderForm")
.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (!db) {
    message.textContent =
      "La connexion Supabase n'est pas encore configurée.";
    return;
  }

  const selected = (prices[game.value] || [])[
    Number(pack.value)
  ];

  if (!selected) {
    message.textContent = "Choisis un forfait valide.";
    return;
  }

  const button = document.getElementById("submitButton");
  button.disabled = true;
  message.textContent = "Envoi de la commande...";

  const orderNumber = newOrderNumber();

  const order = {
    order_number: orderNumber,
    game: game.value,
    player_id: document.getElementById("player").value.trim(),
    package_name: selected.name,
    amount: selected.amount,
    payment_method: document.getElementById("payment").value,
    customer_contact: document.getElementById("contact").value.trim()
  };

  try {
    const { error } = await db
      .from("orders")
      .insert([order]);

    if (error) {
      throw error;
    }

    message.textContent =
      "Commande enregistrée ! Numéro : " + orderNumber +
      ". Statut : en attente. Contacte le vendeur pour confirmer " +
      "le paiement. Aucun paiement n'a été effectué par ce formulaire.";

    document.getElementById("orderForm").reset();
    pack.innerHTML =
      '<option value="">Choisir un forfait</option>';
    price.textContent = "Sélectionne un jeu et un forfait.";

  } catch (error) {
    console.error(error);

    message.textContent =
      "Impossible d'enregistrer la commande. " +
      "Vérifie la connexion et les règles de sécurité Supabase.";
  } finally {
    button.disabled = false;
  }
});

const adminMessage = document.getElementById("adminMessage");
const dashboard = document.getElementById("dashboard");
const ordersElement = document.getElementById("orders");

function showAdminMessage(text) {
  adminMessage.textContent = text;
}

async function loadOrders() {
  if (!db) return;

  ordersElement.textContent = "Chargement...";

  const { data, error } = await db
    .from("orders")
    .select(
      "id, order_number, game, player_id, package_name, amount, payment_method, customer_contact, status, created_at"
    )
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    ordersElement.textContent =
      "Impossible de charger les commandes. Vérifie les droits administrateur.";
    return;
  }

  ordersElement.replaceChildren();

  if (!data || data.length === 0) {
    ordersElement.textContent = "Aucune commande pour le moment.";
    return;
  }

  data.forEach(function (order) {
    const card = document.createElement("article");
    card.className = "order";

    const details = document.createElement("p");

    details.textContent =
      "Commande : " + order.order_number +
      "\nJeu : " + order.game +
      "\nJoueur : " + order.player_id +
      "\nForfait : " + order.package_name +
      "\nPrix enregistré : " + order.amount + " USD" +
      "\nPaiement : " + order.payment_method +
      "\nContact : " + order.customer_contact +
      "\nStatut : " + order.status;

    details.style.whiteSpace = "pre-line";
    card.appendChild(details);

    const statusSelect = document.createElement("select");

    const statuses = [
      ["pending", "En attente"],
      ["payment_verified", "Paiement vérifié"],
      ["processing", "En traitement"],
      ["completed", "Terminé"],
      ["rejected", "Refusé"]
    ];

    statuses.forEach(function (status) {
      const option = document.createElement("option");
      option.value = status[0];
      option.textContent = status[1];
      statusSelect.appendChild(option);
    });

    statusSelect.value = order.status;
    card.appendChild(statusSelect);

    const updateButton = document.createElement("button");
    updateButton.textContent = "Mettre à jour le statut";

    updateButton.addEventListener("click", async function () {
      updateButton.disabled = true;

      const { error } = await db
        .from("orders")
        .update({ status: statusSelect.value })
        .eq("id", order.id);

      updateButton.disabled = false;

      if (error) {
        alert("Modification impossible. Vérifie les autorisations.");
        return;
      }

      alert("Statut mis à jour.");
      await loadOrders();
    });

    card.appendChild(updateButton);
    ordersElement.appendChild(card);
  });
}

document.getElementById("loginForm")
.addEventListener("submit", async function (event) {
  event.preventDefault();

  if (!db) {
    showAdminMessage("Configure d'abord Supabase.");
    return;
  }

  showAdminMessage("Connexion...");

  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    showAdminMessage(
      "Connexion impossible. Vérifie tes identifiants."
    );
    return;
  }

  const { data: admin, error: adminError } = await db
    .from("admin_users")
    .select("user_id")
    .limit(1);

  const { data: sessionData } = await db.auth.getUser();

  const isAdmin =
    !adminError &&
    admin &&
    sessionData.user &&
    admin.some(function (item) {
      return item.user_id === sessionData.user.id;
    });

  if (!isAdmin) {
    await db.auth.signOut();
    showAdminMessage("Ce compte n'a pas accès à l'administration.");
    return;
  }

  showAdminMessage("Connexion administrateur réussie.");
  dashboard.classList.remove("hidden");

  await loadOrders();
});

document.getElementById("refreshButton")
.addEventListener("click", loadOrders);

document.getElementById("logoutButton")
.addEventListener("click", async function () {
  if (db) {
    await db.auth.signOut();
  }

  dashboard.classList.add("hidden");
  ordersElement.replaceChildren();
  showAdminMessage("Déconnecté.");
});

if (!configured) {
  message.textContent =
    "Pour activer le site, renseigne l'URL et la clé publique Supabase.";
}
</script>

</body>
</html>
